{% assign page_url = page.url | absolute_url %}
<script type="application/ld+json">
{"@context":"https://schema.org","@graph":[
{"@type":"Organization","@id":"{{ site.url }}/#organization","name":"ParalelVR","url":"{{ site.url }}/","logo":"{{ '/paralelogo2.png' | absolute_url }}","description":{{ site.description | jsonify }},"telephone":"+51912576685","sameAs":["https://www.instagram.com/paralelvr/"],"areaServed":[{"@type":"City","name":"Lima"},{"@type":"Country","name":"Perú"}]},
{"@type":"WebSite","@id":"{{ site.url }}/#website","name":"ParalelVR","url":"{{ site.url }}/","publisher":{"@id":"{{ site.url }}/#organization"},"inLanguage":"es-PE"},
{"@type":"WebPage","@id":"{{ page_url }}#webpage","url":"{{ page_url }}","name":{{ page.title | jsonify }},"description":{{ page.description | jsonify }},"isPartOf":{"@id":"{{ site.url }}/#website"},"inLanguage":"es-PE"}
{% if page.service_name %},
{"@type":"Service","@id":"{{ page_url }}#service","name":{{ page.service_name | jsonify }},"description":{{ page.description | jsonify }},"url":"{{ page_url }}","provider":{"@id":"{{ site.url }}/#organization"},"areaServed":[{"@type":"City","name":"Lima"},{"@type":"Country","name":"Perú"}],"audience":{"@type":"BusinessAudience","audienceType":"Marcas, agencias y organizadores de eventos"}}
{% endif %}
{% if page.url != '/' %},
{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Inicio","item":"{{ site.url }}/"},{"@type":"ListItem","position":2,"name":{{ page.breadcrumb | default: page.service_name | default: page.title | jsonify }},"item":"{{ page_url }}"}]}
{% endif %}
]}
</script>
